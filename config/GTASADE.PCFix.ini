; GTASADE PC Fix settings.
; With ReShade (add-on support) most of these can be changed in the ReShade overlay:
; Home -> Add-ons -> GTASADE PC Fix.

[Mouse]
; 1 = raw mouse camera on, 0 = off (game's own mouse handling).
Enabled=1
; Camera sensitivity multipliers. 1.0 = unchanged.
SensitivityX=1.0
SensitivityY=1.0
; Mouse data source: 0 = auto (recommended), 1 = game process only, 2 = helper process only.
InputSource=0

[Game]
; FPS cap kept by the mod. The game resets its own cap to 60 on every launch.
; 0 = off (the game decides), -1 = unlimited, otherwise 30/60/90/120/180/240.
; 120 is the highest cap without the remaster's high-FPS animation glitches.
MaxFps=120

[Developer]
; Full mouse/camera traces for troubleshooting. Leave off for normal play.
Enabled=0
; Folder for traces (empty = GTASADE.PCFix_logs next to this file).
LogDirectory=
